<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPB Tracker</title>
<style>
:root{ --bg:#f5f5f5; --card:#fff; --primary:#1a237e; --accent:#d32f2f; --text:#333; --muted:#888; --border:#e0e0e0; --live:#4caf50; --final:#757575; --cancel:#f44336; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); padding:16px; max-width:900px; margin:0 auto; }
header{ text-align:center; margin-bottom:16px; }
header h1{ font-size:1.4rem; color:var(--primary); }
#version-info{ font-size:.75rem; color:var(--muted); margin-top:4px; }
#controls{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
#controls button{ padding:8px 14px; border:none; border-radius:6px; background:var(--primary); color:#fff; font-size:.9rem; cursor:pointer; }
#controls button.active{ background:var(--accent); }
#date-display{ margin-left:auto; font-size:.9rem; color:var(--muted); }
#games-list{ display:grid; grid-template-columns:1fr; gap:12px; }
@media(min-width:600px){ #games-list{ grid-template-columns:1fr 1fr; } }
.game-card{ background:var(--card); border-radius:10px; padding:14px; box-shadow:0 2px 6px rgba(0,0,0,.08); cursor:pointer; transition:transform .1s; }
.game-card:active{ transform:scale(.98); }
.game-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.game-status{ font-size:.78rem; font-weight:600; padding:3px 8px; border-radius:12px; color:#fff; }
.game-status.live{ background:var(--live); }
.game-status.final{ background:var(--final); }
.game-status.cancel{ background:var(--cancel); }
.game-status.upcoming{ background:#ff9800; }
.teams{ display:flex; flex-direction:column; gap:10px; }
.team-row{ display:flex; align-items:center; justify-content:space-between; }
.team-name{ font-size:1rem; font-weight:600; }
.team-score{ font-size:1.3rem; font-weight:700; color:var(--primary); min-width:28px; text-align:right; }
.team-score.leading{ color:var(--accent); }
.divider{ height:1px; background:var(--border); margin:8px 0; }
.inning-info{ font-size:.85rem; color:var(--muted); text-align:center; margin-top:6px; }
#loading{ text-align:center; color:var(--muted); padding:20px; }
#error{ text-align:center; color:var(--accent); padding:20px; font-size:.9rem; }
.empty{ text-align:center; color:var(--muted); padding:30px; font-size:.9rem; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
.modal-overlay.open{ display:flex; }
.modal-content{ background:var(--card); border-radius:12px; padding:20px; width:100%; max-width:360px; }
.modal-title{ font-size:1.1rem; font-weight:700; margin-bottom:16px; color:var(--primary); }
.form-group{ margin-bottom:12px; }
.form-group label{ display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
.form-group input,.form-group select{ width:100%; padding:10px; border:1px solid var(--border); border-radius:6px; font-size:1rem; }
.modal-actions{ display:flex; gap:8px; margin-top:16px; }
.modal-actions button{ flex:1; padding:10px; border:none; border-radius:6px; font-size:.9rem; cursor:pointer; }
.btn-secondary{ background:var(--border); color:var(--text); }
.btn-primary{ background:var(--primary); color:#fff; }
</style>
</head>
<body>
<header>
<h1>NPB Tracker</h1>
<div id="version-info"></div>
</header>
<div id="controls">
<button id="btn-all" class="active" onclick="filterLeague('all')">ALL</button>
<button id="btn-central" onclick="filterLeague('central')">セ・リーグ</button>
<button id="btn-pacific" onclick="filterLeague('pacific')">パ・リーグ</button>
<span id="date-display"></span>
</div>
<div id="loading">読み込み中...</div>
<div id="error" style="display:none"></div>
<div id="games-list" style="display:none"></div>
<div class="empty" id="empty" style="display:none">試合がありません</div>

<div class="modal-overlay" id="manualModal">
<div class="modal-content">
<div class="modal-title" id="modalTitle">スコア更新</div>
<div class="form-group">
<label>ビジター得点</label>
<input type="number" id="awayScoreInput" min="0">
</div>
<div class="form-group">
<label>ホーム得点</label>
<input type="number" id="homeScoreInput" min="0">
</div>
<div class="form-group">
<label>イニング</label>
<input type="number" id="inningInput" min="1" max="15" value="1">
</div>
<div class="form-group">
<label>表裏</label>
<select id="inningSideInput"><option value="top">表</option><option value="bottom">裏</option></select>
</div>
<div class="form-group">
<label>状態</label>
<select id="statusInput"><option value="live">試合中</option><option value="final">試合終了</option><option value="cancel">試合中止</option></select>
</div>
<div class="modal-actions">
<button class="btn-secondary" onclick="closeManualScoreModal()">キャンセル</button>
<button class="btn-primary" onclick="saveManualScore()">保存</button>
</div>
</div>
</div>

<script>
const VERSION='2.0.0';
const APP_UPDATED='2026-09-10';
const TEAM_MAP={
  1:{name:'巨人',league:'central',color:'#ff7334'},2:{name:'ヤクルト',league:'central',color:'#1a5c3d'},
  376:{name:'DeNA',league:'central',color:'#00ada9'},5:{name:'阪神',league:'central',color:'#ffdc0a'},
  6:{name:'広島',league:'central',color:'#ff0000'},4:{name:'中日',league:'central',color:'#2452a3'},
  7:{name:'西武',league:'pacific',color:'#000000'},8:{name:'日本ハム',league:'pacific',color:'#005596'},
  9:{name:'ロッテ',league:'pacific',color:'#888888'},11:{name:'オリックス',league:'pacific',color:'#161d44'},
  12:{name:'ソフトバンク',league:'pacific',color:'#ffb200'}
};
const TEAM_NAME_TO_ID={};
Object.entries(TEAM_MAP).forEach(([id,t])=>{ TEAM_NAME_TO_ID[t.name]=parseInt(id); });

let currentLeague='all';
let upcomingGames=[];
let currentModalGameKey=null;

function init(){ document.getElementById('version-info').textContent='v'+VERSION+' | '+APP_UPDATED; const n=new Date(); const d=('0'+n.getDate()).slice(-2); const m=('0'+(n.getMonth()+1)).slice(-2); document.getElementById('date-display').textContent=m+'/'+d; loadSchedule(); setInterval(refreshLiveScores,30000); }

function filterLeague(l){ currentLeague=l; ['all','central','pacific'].forEach(x=>document.getElementById('btn-'+x).classList.toggle('active',x===l)); renderUpcoming(); }

async function loadSchedule(){
  document.getElementById('loading').style.display='block';
  document.getElementById('error').style.display='none';
  try{
    upcomingGames=buildTodaySchedule();
    await refreshLiveScores();
    document.getElementById('loading').style.display='none';
    document.getElementById('games-list').style.display='grid';
  }catch(e){ console.error(e); document.getElementById('loading').style.display='none'; document.getElementById('error').style.display='block'; document.getElementById('error').textContent='読み込みエラー: '+e.message; }
}

function buildTodaySchedule(){
  const today=new Date();
  const dateStr=today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);
  const day=today.getDay();
  const games=[];
  const cs=[['巨人','DeNA'],['ヤクルト','阪神'],['広島','中日']];
  const ps=[['西武','日本ハム'],['ロッテ','オリックス'],['ソフトバンク','楽天']];
  const all=day===2?[]:day===1?ps:cs.concat(ps);
  all.forEach(([a,b],i)=>{
    const id1=TEAM_NAME_TO_ID[a], id2=TEAM_NAME_TO_ID[b];
    if(!id1||!id2) return;
    const t1=TEAM_MAP[id1], t2=TEAM_MAP[id2];
    games.push({gameKey:id1+'-'+id2,gameDate:dateStr,team1:id1,team2:id2,team1Name:t1.name,team2Name:t2.name,league:t1.league,homeScore:null,awayScore:null,inning:null,inningSide:null,isLive:false,isFinal:false,isCancelled:false,statusDetail:'試合前',startTime:'18:00'});
  });
  return games;
}

async function refreshLiveScores(){
  try{
    console.log('[Front] Fetching /api/score');
    const res=await fetch('/api/score');
    if(!res.ok){ console.log('[Front] API error',res.status); return; }
    const liveGames=await res.json();
    console.log('[Front] Live games:',Array.isArray(liveGames)?liveGames.length:'not array',typeof liveGames);
    if(!Array.isArray(liveGames)){ console.log('[Front] Invalid response format'); return; }
    if(liveGames.length>0) console.log('[Front] First game:',JSON.stringify(liveGames[0]).slice(0,120));

    upcomingGames=mergeScheduleGames(upcomingGames,liveGames);
    renderUpcoming();
  }catch(e){ console.error('[Front] refresh error:',e); }
}

function mergeScheduleGames(schedule,liveGames){
  const liveFields=['homeScore','awayScore','inning','inningSide','isLive','isFinal','isCancelled','statusDetail'];
  const map=new Map(schedule.map(g=>[g.gameKey,g]));

  liveGames.forEach(lg=>{
    const homeId=TEAM_NAME_TO_ID[lg.homeTeam];
    const awayId=TEAM_NAME_TO_ID[lg.awayTeam];
    if(!homeId||!awayId){ console.log('[Front] Unknown teams:',lg.homeTeam,lg.awayTeam); return; }

    const key1=awayId+'-'+homeId;
    const key2=homeId+'-'+awayId;
    let g=map.get(key1)||map.get(key2);

    if(!g){
      const today=new Date();
      const dateStr=today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);
      const ht=TEAM_MAP[homeId], at=TEAM_MAP[awayId];
      g={gameKey:key1,gameDate:dateStr,team1:awayId,team2:homeId,team1Name:at.name,team2Name:ht.name,league:ht.league,homeScore:null,awayScore:null,inning:null,inningSide:null,isLive:false,isFinal:false,isCancelled:false,statusDetail:'',startTime:'18:00'};
      map.set(key1,g);
    }

    liveFields.forEach(f=>{
      if(lg[f]!==undefined&&lg[f]!==null) g[f]=lg[f];
    });
  });

  return Array.from(map.values());
}

function renderUpcoming(){
  const container=document.getElementById('games-list');
  const filtered=currentLeague==='all'?upcomingGames:upcomingGames.filter(g=>TEAM_MAP[g.team2].league===currentLeague);
  if(filtered.length===0){ container.style.display='none'; document.getElementById('empty').style.display='block'; return; }
  container.style.display='grid'; document.getElementById('empty').style.display='none';
  container.innerHTML=filtered.map(g=>{
    const t1=TEAM_MAP[g.team1], t2=TEAM_MAP[g.team2];
    const s1=g.awayScore!==null&&g.awayScore!==undefined?g.awayScore:'-';
    const s2=g.homeScore!==null&&g.homeScore!==undefined?g.homeScore:'-';
    const s1Class=g.awayScore!==null&&g.homeScore!==null&&g.awayScore>g.homeScore?'leading':'';
    const s2Class=g.awayScore!==null&&g.homeScore!==null&&g.homeScore>g.awayScore?'leading':'';
    let stClass='upcoming', stText=g.statusDetail||'試合前';
    if(g.isLive){ stClass='live'; }
    else if(g.isFinal){ stClass='final'; stText='終了'; }
    else if(g.isCancelled){ stClass='cancel'; stText='中止'; }
    return `<div class="game-card" onclick="openManualScoreModal('${g.gameKey}')">
      <div class="game-header"><span class="game-status ${stClass}">${stText}</span></div>
      <div class="teams">
        <div class="team-row"><span class="team-name">${t1.name}</span><span class="team-score ${s1Class}">${s1}</span></div>
        <div class="divider"></div>
        <div class="team-row"><span class="team-name">${t2.name}</span><span class="team-score ${s2Class}">${s2}</span></div>
      </div>
      ${g.inning?`<div class="inning-info">${g.inning}回${g.inningSide==='top'?'表':'裏'}</div>`:''}
    </div>`;
  }).join('');
}

function openManualScoreModal(gameKey){
  currentModalGameKey=gameKey;
  const g=upcomingGames.find(x=>x.gameKey===gameKey);
  if(!g) return;
  document.getElementById('modalTitle').textContent=(TEAM_MAP[g.team1]?.name||g.team1)+' vs '+(TEAM_MAP[g.team2]?.name||g.team2);
  document.getElementById('awayScoreInput').value=g.awayScore!==null?g.awayScore:0;
  document.getElementById('homeScoreInput').value=g.homeScore!==null?g.homeScore:0;
  document.getElementById('inningInput').value=g.inning||1;
  document.getElementById('inningSideInput').value=g.inningSide||'top';
  let st='live'; if(g.isFinal) st='final'; else if(g.isCancelled) st='cancel';
  document.getElementById('statusInput').value=st;
  document.getElementById('manualModal').classList.add('open');
}

function closeManualScoreModal(){ document.getElementById('manualModal').classList.remove('open'); currentModalGameKey=null; }

function saveManualScore(){
  if(!currentModalGameKey) return;
  const g=upcomingGames.find(x=>x.gameKey===currentModalGameKey);
  if(!g) return;
  g.awayScore=parseInt(document.getElementById('awayScoreInput').value,10)||0;
  g.homeScore=parseInt(document.getElementById('homeScoreInput').value,10)||0;
  g.inning=parseInt(document.getElementById('inningInput').value,10)||1;
  g.inningSide=document.getElementById('inningSideInput').value;
  const st=document.getElementById('statusInput').value;
  g.isLive=st==='live'; g.isFinal=st==='final'; g.isCancelled=st==='cancel';
  g.statusDetail=st==='live'?(g.inning+'回'+(g.inningSide==='top'?'表':'裏')):st==='final'?'試合終了':st==='cancel'?'試合中止':'試合前';
  renderUpcoming(); closeManualScoreModal();
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeManualScoreModal(); });
document.getElementById('manualModal').addEventListener('click',e=>{ if(e.target===document.getElementById('manualModal')) closeManualScoreModal(); });
init();
</script>
</body>
</html>
